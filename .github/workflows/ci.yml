
name: CI — verify and publish image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/antton-lukyanov/devops-ci-app

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Pylint
        run: |
          pylint app tests --fail-under=8.0

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest
        env:
          PYTHONPATH: .
        run: pytest -v

  image:
    name: Build and smoke-test image
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:latest

      - name: Run container
        run: |
          docker run -d --name devops-ci-app -p 5000:5000 ${{ env.IMAGE_NAME }}:latest
          for i in {1..15}; do
            if curl -fsS http://localhost:5000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs devops-ci-app
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f devops-ci-app || true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
  deploy:
    name: Deploy to devops VM
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, devops-vm]

    permissions:
      contents: read

    concurrency:
      group: deploy-devops-vm
      cancel-in-progress: false

    env:
      VM_HOST: 192.168.56.101

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy with Ansible
        run: wsl.exe -e sh -lc "cd '/mnt/c/actions-runner/_work/devops-ci-app/devops-ci-app/ansible' && ansible-playbook -i inventory/prod.ini site.yml -e app_tag=${{ github.sha }}"
      - name: Check through Nginx
        run: curl.exe --fail --silent --show-error http://${VM_HOST}/health